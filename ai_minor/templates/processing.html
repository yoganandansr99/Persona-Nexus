{% extends "layouts/base.html" %}
{% block title %}Analyzing Interview{% endblock %}
{% block content %}
<div class="container nx-portal-practice" style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="nx-card" style="padding: 3rem;">
        <h2 class="nx-hero-title" style="font-size: 2rem; margin-bottom: 1rem;">Analyzing Your Interview</h2>
        <p class="nx-lead" id="statusMessage">Starting AI evaluation...</p>
        
        <div style="margin: 2rem 0; background: rgba(255,255,255,0.05); border-radius: 999px; height: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
            <div id="progressBar" style="width: 5%; height: 100%; background: linear-gradient(90deg, #7c3aed, #4f46e5); transition: width 0.5s ease; box-shadow: 0 0 20px rgba(124,58,237,0.5);"></div>
        </div>
        
        <div class="nx-loading-spinner" style="margin: 0 auto 2rem;"></div>
        
        <p style="font-size: 0.9rem; color: #64748b;">This usually takes 15-30 seconds depending on the number of questions. Please do not close this window.</p>
    </div>
</div>

<script>
    const task_id = "{{ task_id }}";
    const statusMessage = document.getElementById('statusMessage');
    const progressBar = document.getElementById('progressBar');

    async function pollStatus() {
        try {
            const response = await fetch(`/status?task_id=${task_id}`);
            const data = await response.json();
            
            if (data.status === 'completed') {
                progressBar.style.width = '100%';
                statusMessage.innerText = 'Analysis complete! Redirecting...';
                // Small delay to show 100%
                setTimeout(() => {
                    window.location.href = '/report_final?task_id=' + task_id;
                }, 1000);
            } else if (data.status === 'failed') {
                statusMessage.innerText = 'Error: ' + (data.error || 'Analysis failed');
                statusMessage.style.color = '#ef4444';
            } else {
                progressBar.style.width = data.progress + '%';
                statusMessage.innerText = data.message;
                // Poll again in 2 seconds
                setTimeout(pollStatus, 2000);
            }
        } catch (error) {
            console.error('Polling error:', error);
            setTimeout(pollStatus, 3000);
        }
    }

    pollStatus();
</script>
{% endblock %}
