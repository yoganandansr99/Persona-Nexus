<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personality Profiler - Welcome</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">AI Personality Profiler</h1>
        <div class="report-section" style="text-align: center;">
            <p>Welcome! This tool uses AI to analyze your personality based on verbal and visual cues.</p>
            <p>Please enter your details to verify your identity and begin.</p>
            
            <form action="/initiate" method="POST" class="user-form" style="max-width: 400px; margin: 20px auto; text-align: left;">
                
                <div class="form-group">
                    <label for="username">Name:</label>
                    <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc;">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer_not_to_say">Prefer not to say</option>
                    </select>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Send Verification Code</button>
            </form>
        </div>
    </div>
</body>
</html>
