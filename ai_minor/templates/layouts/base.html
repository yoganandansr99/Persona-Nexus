<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Persona Nexus{% endblock %} — AI Interview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="nx-body {% block body_class %}{% endblock %}">
    <div class="nx-aurora" aria-hidden="true"></div>
    <div class="nx-grid-bg" aria-hidden="true"></div>

    <header class="nx-header">
        <div class="nx-header-inner">
            <a href="{{ url_for('welcome') }}" class="nx-logo">
                <span class="nx-logo-mark"></span>
                <span class="nx-logo-text">Persona Nexus</span>
            </a>
            <button type="button" class="nx-burger" id="nxBurger" aria-label="Open menu" aria-expanded="false"></button>
            <nav class="nx-nav" id="nxNav">
                <a href="{{ url_for('welcome') }}" class="nx-navlink{% if request.path == '/' %} is-active{% endif %}">Home</a>
                <a href="{{ url_for('practice.practice_home') }}" class="nx-navlink{% if request.path.startswith('/practice') %} is-active{% endif %}">Practice</a>
                <a href="{{ url_for('recruiter.recruiter_home') }}" class="nx-navlink{% if request.path.startswith('/recruiter') or request.path.startswith('/company') %} is-active{% endif %}">Recruiter</a>
                <a href="{{ url_for('interview_portal.interview_access_gate') }}" class="nx-navlink nx-navlink--accent{% if request.path.startswith('/interview/access') %} is-active{% endif %}">Interview access</a>
                <a href="{{ url_for('about_page') }}" class="nx-navlink{% if request.path.startswith('/about') %} is-active{% endif %}">About</a>
                <a href="{{ url_for('support_page') }}" class="nx-navlink{% if request.path.startswith('/support') %} is-active{% endif %}">Support</a>
            </nav>
        </div>
    </header>

    <main class="nx-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="nx-footer">
        <span>Persona Nexus</span>
        <span class="nx-dot">·</span>
        <span>Practice · Company · Secure interview links</span>
    </footer>

    <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
