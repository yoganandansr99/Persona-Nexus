version: '3.8'

# Production environment overrides
services:
  app:
    environment:
      - FLASK_ENV=production
      - DEBUG=False
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s

  mongodb:
    environment:
      - MONGO_LOG_LEVEL=error
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    volumes:
      - mongodb_data_prod:/data/db
      - mongodb_config_prod:/data/configdb

  nginx:
    environment:
      - NGINX_ENV=production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  mongodb_data_prod:
    driver: local
  mongodb_config_prod:
    driver: local
